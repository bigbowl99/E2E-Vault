<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4"/>
  
  <g filter="url(#glow)">
    <!-- Shield -->
    <path d="M256 90 L380 145 C380 270 256 390 256 420 C256 390 132 270 132 145 Z" fill="url(#shieldGrad)"/>
    <!-- Lock body -->
    <rect x="216" y="240" width="80" height="70" rx="14" fill="#0f172a"/>
    <!-- Lock shackle -->
    <path d="M232 240 V205 C232 191 243 180 256 180 C269 180 280 191 280 205 V240" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="256" cy="270" r="7" fill="#10b981"/>
    <path d="M253 270 L259 270 L261 292 L251 292 Z" fill="#10b981"/>
  </g>
</svg>
